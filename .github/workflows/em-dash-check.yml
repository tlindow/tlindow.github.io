name: Em dash check

on:
  pull_request:

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        working-directory: ./site
        run: npm ci

      - name: Build static site
        working-directory: ./site
        run: npm run build

      - name: Confirm band excerpts are copied from post text
        working-directory: ./site
        run: node scripts/verify-band-excerpts.mjs

      - name: Report em dashes in built HTML
        working-directory: ./site
        run: node scripts/check-em-dashes.mjs
