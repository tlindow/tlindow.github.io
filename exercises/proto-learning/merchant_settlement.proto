syntax = "proto3";

package fintech.settlement.v1;

// Step 1 starter: use Timestamp later for settlement and ledger event audit times.
import "google/protobuf/timestamp.proto";


// ----------------------------------------------------------------------------
// 1. Monetary Precision
// ----------------------------------------------------------------------------
// Challenge: Represent currency values without floating-point precision loss.
// A settlement batch needs to calculate gross volume, fees, deductions, and net payouts.
//
// Comment on this block with:
// How should we structure a Money message to represent $1,250.75 USD or ¥10,000 JPY?
message Money {
  // ISO 4217 code like "USD" or "JPY".
  string currency_code = 1;
  // Whole amount in major currency units (e.g. dollars).
  int64 units = 2;
  // Fractional amount in billionths of a unit (e.g. $12.75 => 750000000).
  int32 nanos = 3;
  // Note: "= 1", "= 2", "= 3" are field tags for wire encoding and compatibility.
}


