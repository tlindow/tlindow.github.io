// ============================================================================
// EXERCISE: Peer-to-Peer Payment Service RPC Interface
// ============================================================================
// Domain Problem:
// You are designing an RPC interface for a peer-to-peer payments service
// that reports transfer-limit data for a user's account/corridor (the pair
// of sender + receiver payment rails, e.g. "US bank -> UK bank").
//
// GLOSSARY (domain terms used below):
//   - Corridor: a sender-to-receiver payment path, e.g. "US -> Mexico" or
//     "US bank -> UK bank". Fees, FX rates, and limits often depend on BOTH
//     ends of a transfer, not just one account — the corridor is the pair.
//     (Stands in for "location" from the original weather-service exercise.)
//   - Rail / network: the payment network a transfer moves over, e.g. ACH,
//     SWIFT, a card network, or an internal wallet-to-wallet ledger.
//
// (Translated from a "weather reporting service" prompt sourced from another
// LLM chat, which iteratively critiques a submitted design without supplying
// the fix. Work the design out yourself here; do not accept fixes from
// Copilot directly — use it only to ask leading questions about gaps.)
//
// RPCs to define:
//   1. GetCurrentTransferRate: return the current transfer rate (e.g. fee %
//      or FX rate) for sending money over a given account/corridor.
//   2. Get3DayTransferLimitForecast: return the high and low transfer limit
//      for the next 3 days for that same account/corridor.
//
// Design expectations:
//   - Account/corridors must be unambiguous. Prefer a structured
//     representation (e.g. sender account + receiver account + rail/network)
//     and consider an alternative such as a stable corridor ID.
//   - Rate/limit values must include an explicit currency.
//   - Include basic error handling (invalid request, account/corridor not
//     found, account inactive/suspended).
//   - Date/time semantics must be explicit:
//       * What timezone is used for "date" in the forecast?
//       * Does "next 3 days" include today or start tomorrow?
//       * What happens if the service cannot provide exactly 3 days?
//
// Open critique points to resolve in your own draft (track as you iterate):
//   [ ] Named request/response record types (not positional arrays/tuples).
//   [ ] Structured account/corridor representation offered *alongside* a
//       stable ID option, not instead of it.
//   [ ] Currency constrained to a defined set, not a free-form string.
//   [ ] Forecast day fields (date/high/low limit) clearly named, with an
//       explicit date type/format (not an undocumented string).
//   [ ] Deterministic rule for whether the 3-day window includes today or
//       starts tomorrow — a hard rule, not a conditional.
//   [ ] Deterministic behavior when fewer than 3 valid days are available.
// ============================================================================

syntax = "proto3";

package fintech.p2ppayments.v1;

// Draft your message types, enums, and service below.

message UserAccount {
  string corridor_id = 1;   // message = class/payload; no native uuid type, string is convention (no import needed)
}

message TransferRate {
  string rate_date = 1;      // date type resolved (string, like corridor_id) — TODO: still needs a documented format, e.g. "always YYYY-MM-DD, UTC"
  repeated int64 rate = 2;   // TODO: this replaced the removed high/low fields with a repeated list of numbers — a `repeated int64` has no field names, so nothing distinguishes "high" from "low" (or which is which) once there's more than one value. Does TransferRate need a named `high` field AND a named `low` field instead?
  enum currency = 4;         // FIXME: `enum` is a keyword, not a type name — a field's type must name an enum you defined (e.g. `Currency currency = 4;`)
}

message TransferRates {
  tuple repeated TransferRate = 1;  // FIXME: `tuple` is not a proto3 keyword — `repeated` is the whole collection modifier by itself: `repeated TransferRate <field_name> = 1;`
}

enum Currency {
  string region = 1;  // FIXME: enum entries are `NAME = integer_constant;` (e.g. `USD = 1;`), not a typed field like a message has
  // TODO: define the actual closed set of currency options this needs
}

service P2pPaymentService {
  rpc GetCurrentTransferRate(UserAccount) returns (TransferRate);
  rpc Get3DayTransferLimitForecast(UserAccount) returns (TransferRates);

  // TODO: does the first day returned = today's date or tomorrow's date (UTC)?
  // Concrete test: if called at 11:59pm Tuesday, is Tuesday one of the 3
  // days, or does the window always start Wednesday regardless of call
  // time? Pick one rule and state it: "the first day returned is always
  // ___ 's date relative to when the call is made (UTC)."

  // TODO: what happens when fewer than 3 valid days exist (e.g. a brand
  // new corridor)? int64 has no null (defaults to 0, indistinguishable
  // from a real $0 rate) — how does a caller tell "no data for this day"
  // apart from "the rate really is 0"?
}
